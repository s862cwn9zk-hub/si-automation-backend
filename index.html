<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SI Automation — Chat</title>
<style>
  body { font-family: sans-serif; background: #0F1614; color: #EAF0EC; margin: 0; height: 100vh; display: flex; flex-direction: column; }
  header { padding: 16px; background: #16211E; border-bottom: 1px solid #2A3A35; }
  header h1 { margin: 0; font-size: 18px; }
  main { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; max-width: 85%; }
  .row.user { align-self: flex-end; }
  .row.bot { align-self: flex-start; }
  .bubble { padding: 10px 14px; border-radius: 14px; font-size: 14px; }
  .user .bubble { background: #FF7A3D; color: white; }
  .bot .bubble { background: #1C2925; border: 1px solid #2A3A35; }
  footer { padding: 10px; background: #16211E; border-top: 1px solid #2A3A35; display: flex; gap: 8px; }
  input { flex: 1; padding: 10px; border-radius: 20px; border: 1px solid #2A3A35; background: #1C2925; color: white; }
  button { padding: 10px 16px; border-radius: 20px; border: none; background: #FF7A3D; color: white; }
</style>
</head>
<body>
<header><h1>SI Automation — Chat</h1></header>
<main id="messages"></main>
<footer>
  <input id="input" placeholder="Napisz wiadomość...">
  <button onclick="send()">Wyślij</button>
</footer>
<script>
  const BACKEND_URL = 'https://si-automation-backend.onrender.com';
  let history = [];
  const messages = document.getElementById('messages');
  const input = document.getElementById('input');

  function addMsg(role, text) {
    const row = document.createElement('div');
    row.className = 'row ' + role;
    row.innerHTML = '<div class="bubble"></div>';
    row.querySelector('.bubble').textContent = text;
    messages.appendChild(row);
    messages.scrollTop = messages.scrollHeight;
  }

  async function send() {
    const text = input.value.trim();
    if (!text) return;
    addMsg('user', text);
    history.push({role: 'user', content: text});
    input.value = '';
    addMsg('bot', '...');
    try {
      const res = await fetch(BACKEND_URL + '/chat', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({message: text, history: history})
      });
      const data = await res.json();
      messages.lastChild.remove();
      addMsg('bot', data.reply);
      history.push({role: 'assistant', content: data.reply});
    } catch (e) {
      messages.lastChild.remove();
      addMsg('bot', 'Błąd: ' + e.message);
    }
  }

  input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
  addMsg('bot', 'Cześć! Jestem SI Automation.');
</script>
</body>
</html>
